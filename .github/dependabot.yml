version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # 10.x needs conventional-changelog-writer@9; @semantic-release/release-notes-generator still uses writer@8.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major
