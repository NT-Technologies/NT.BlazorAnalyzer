name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NT.BlazorAnalyzer.slnx

      - name: Build
        run: dotnet build NT.BlazorAnalyzer.slnx -c Release --no-restore -v minimal

      - name: Test With Coverage
        run: dotnet test --solution NT.BlazorAnalyzer.slnx -c Release --no-build --coverage --coverage-output-format cobertura --coverage-output "${{ github.workspace }}/TestResults/coverage.cobertura.xml"

      - name: Dump Test Failure Logs
        if: failure()
        run: |
          echo "Searching for Microsoft Testing Platform failure logs..."
          mapfile -t test_logs < <(find "${{ github.workspace }}" -type f -path '*/TestResults/*.log' | sort)

          if [ "${#test_logs[@]}" -eq 0 ]; then
            echo "No test log files were found under TestResults."
            exit 0
          fi

          for log_path in "${test_logs[@]}"; do
            echo "::group::${log_path}"
            grep -a -v 'tests running' "${log_path}" | sed '/^[[:space:]]*$/d'
            echo "::endgroup::"
          done

      - name: Upload Test Result Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults/**
            **/TestResults/**
          if-no-files-found: ignore

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: TestResults/coverage.cobertura.xml
          if-no-files-found: ignore
