name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NT.BlazorAnalyzer.slnx

      - name: Build
        run: dotnet build NT.BlazorAnalyzer.slnx -c Release --no-restore -v minimal

      - name: Test With Coverage
        run: dotnet test NT.BlazorAnalyzer.slnx -c Release --no-build -p:TestingPlatformCommandLineArguments="--coverage --coverage-output-format cobertura --coverage-output ${{ github.workspace }}/TestResults/coverage.cobertura.xml"

      - name: Dump Test Failure Logs
        if: failure()
        run: |
          echo "Searching for Microsoft Testing Platform failure logs..."
          mapfile -t test_logs < <(find "${{ github.workspace }}" -type f -path '*/TestResults/*.log' | sort)

          if [ "${#test_logs[@]}" -eq 0 ]; then
            echo "No test log files were found under TestResults."
            exit 0
          fi

          for log_path in "${test_logs[@]}"; do
            echo "::group::${log_path}"
            grep -a -v 'tests running' "${log_path}" | sed '/^[[:space:]]*$/d'
            echo "::endgroup::"
          done

      - name: Upload Test Result Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/**
            **/TestResults/**
          if-no-files-found: ignore

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/coverage.cobertura.xml
          if-no-files-found: ignore

  run-semantic-release:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Verify semantic-release token
        shell: bash
        run: |
          if [[ -z "${{ secrets.SEMANTIC_RELEASE_TOKEN }}" ]]; then
            echo "SEMANTIC_RELEASE_TOKEN is required so semantic-release tag pushes can trigger the tag publish workflow." >&2
            exit 1
          fi

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - name: Check if commit is tagged
        id: check-tags
        run: |
          git fetch --tags
          if git describe --exact-match --match "v*" 2>/dev/null; then
            echo "is_tagged=true" >> $GITHUB_OUTPUT
          else
            echo "is_tagged=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check-tags.outputs.is_tagged == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install semantic-release and plugins
        if: steps.check-tags.outputs.is_tagged == 'false'
        run: |
          npm install --no-save semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github

      - name: Run semantic-release
        if: steps.check-tags.outputs.is_tagged == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx semantic-release
